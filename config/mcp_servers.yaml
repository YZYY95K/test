# =============================================================================
# DevFlow MCP Server Configurations
# =============================================================================
# MCP (Model Context Protocol) servers expose external tools to the agent
# runtime in a standardized way. Each server runs as a separate process and
# is reached over stdio or HTTP. DevFlow registers exactly the tools each
# agent is permitted to call — the agent config (agents.yaml) and skill
# config (skills.yaml) reference these by `server:tool` name.
#
# Security: tokens are NEVER inlined here. They are injected at runtime from
# environment variables (see .env.example) via the ${VAR} expansion supported
# by the DevFlow config loader.
# =============================================================================

servers:

  # ===========================================================================
  # github — Official GitHub MCP Server
  # ===========================================================================
  # Wraps the GitHub REST/GraphQL API. Used by LocatorAgent (read files),
  # ReviewerAgent (PR creation/review), and TeamLeader (issue coordination).
  # Auth is a fine-grained personal access token with repo + workflow scopes.
  # ===========================================================================
  github:
    description: "Official GitHub MCP Server — repository, issue, and PR operations."
    enabled: true
    # Transport: stdio keeps secrets off the network; chosen for local runs.
    transport: "stdio"
    # The command the DevFlow runtime spawns to start this MCP server.
    command: "npx"
    args:
      - "-y"
      - "@modelcontextprotocol/server-github"
    # Environment variables passed to the server process. Tokens are expanded
    # from the DevFlow process environment — never hard-coded.
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: "${GITHUB_PERSONAL_ACCESS_TOKEN}"
      GITHUB_REPO_OWNER: "${GITHUB_REPO_OWNER}"
      GITHUB_REPO_NAME: "${GITHUB_REPO_NAME}"
    # Whitelist of tools this server exposes. DevFlow only registers listed
    # tools to agents, even if the server advertises more — least privilege.
    tools:
      - name: "get_file_contents"
        description: "Fetch file contents (or a directory listing) from a repo."
        allowed_agents: ["LocatorAgent"]
        allowed_skills: ["code-root-cause", "github-evidence"]
        # Read-only: safe to expose broadly.
        readonly: true
      - name: "create_pull_request"
        description: "Open a pull request against a base branch."
        allowed_agents: ["ReviewerAgent"]
        allowed_skills: ["pr-reviewer"]
        readonly: false
      - name: "add_review"
        description: "Submit a review (approve / request changes) on a PR."
        allowed_agents: ["ReviewerAgent"]
        allowed_skills: ["pr-reviewer"]
        readonly: false
      - name: "get_issue"
        description: "Fetch an issue by number."
        allowed_agents: ["TeamLeader"]
        allowed_skills: ["team-orchestration"]
        readonly: true
      - name: "add_issue_comment"
        description: "Post a comment on an issue (status updates)."
        allowed_agents: ["TeamLeader"]
        allowed_skills: ["team-orchestration"]
        readonly: false
      - name: "list_issues"
        description: "List issues with optional filters (state, labels)."
        allowed_agents: ["TeamLeader"]
        allowed_skills: ["team-orchestration"]
        readonly: true
    # Rate-limit guardrails. GitHub's secondary rate limit kicks in well
    # before the documented 5000 req/h for token-authed requests; we stay
    # conservative to avoid 403s mid-pipeline.
    rate_limit:
      requests_per_hour: 4000
      burst: 30
      on_limit: "wait_and_retry"
    health_check:
      interval_seconds: 60
      timeout_seconds: 5

  # ===========================================================================
  # cicd — Custom CI/CD MCP Server
  # ===========================================================================
  # DevFlow-owned server exposing pipeline control. Built on the mcp[cli]
  # dependency (see pyproject.toml). Runs as a local HTTP server so multiple
  # agents can share one connection without spawning multiple processes.
  # ===========================================================================
  cicd:
    description: "Custom CI/CD MCP Server — pipeline trigger, results, coverage, rollback."
    enabled: true
    # HTTP transport: supports concurrent agent sessions and is easier to
    # health-check than stdio for a long-lived server.
    transport: "http"
    # Propagate signed task identity to the DevFlow-owned server, which
    # independently re-runs the same Agent+Skill authorization check.
    propagate_context: true
    # Bind loopback only — the CI/CD server must not be reachable externally.
    host: "127.0.0.1"
    port: "${MCP_CICD_PORT}"
    # How the DevFlow runtime launches this server.
    command: "python"
    args:
      - "-m"
      - "devflow.mcp.cicd_server"
    env:
      DEVFLOW_REPOSITORY_ROOT: "${DEVFLOW_REPOSITORY_ROOT}"
      CICD_TEST_COMMAND_JSON: "${CICD_TEST_COMMAND_JSON}"
      CICD_PIPELINE_COMMANDS_JSON: "${CICD_PIPELINE_COMMANDS_JSON}"
      DEVFLOW_MCP_CONTEXT_HMAC_KEY: "${DEVFLOW_MCP_CONTEXT_HMAC_KEY}"
      DEVFLOW_APPROVAL_HMAC_KEY: "${DEVFLOW_APPROVAL_HMAC_KEY}"
      DEVFLOW_CREDENTIAL_BROKER_HMAC_KEY: "${DEVFLOW_CREDENTIAL_BROKER_HMAC_KEY}"
      CICD_REPLAY_STATE_PATH: "${CICD_REPLAY_STATE_PATH}"
      CICD_RELEASE_STATE_PATH: "${CICD_RELEASE_STATE_PATH}"
      CICD_ROLLBACK_COMMAND_JSON: "${CICD_ROLLBACK_COMMAND_JSON}"
      # Logical source/target names only. The credential value is resolved
      # inside the trusted adapter and never appears in MCP arguments.
      CICD_ROLLBACK_CREDENTIAL_SOURCE: "${CICD_ROLLBACK_CREDENTIAL_SOURCE}"
      CICD_ROLLBACK_CREDENTIAL_ENV: "${CICD_ROLLBACK_CREDENTIAL_ENV}"
      HEALTH_CHECK_URL: "${HEALTH_CHECK_URL}"
    tools:
      - name: "run_tests"
        description: >-
          Apply a typed Patch only to a disposable checkout and execute the
          server-owned test adapter. Agents cannot provide shell commands.
        allowed_agents: ["TesterAgent"]
        allowed_skills: ["test-runner"]
        readonly: false
        input_schema:
          type: "object"
          required: ["issue_id", "patch", "full_suite"]
          properties:
            issue_id: {type: "integer", minimum: 1}
            patch: {type: "object"}
            full_suite: {type: "boolean"}
      - name: "trigger_pipeline"
        description: >-
          Trigger a CI pipeline for a branch. Returns a pipeline id used by
          get_test_results / get_coverage.
        allowed_agents: ["TesterAgent"]
        allowed_skills: ["test-runner"]
        input_schema:
          type: "object"
          required: ["branch", "suite"]
          properties:
            branch: {type: "string"}
            suite:
              type: "string"
              enum: ["full", "affected", "smoke"]
        readonly: false
      - name: "get_test_results"
        description: >-
          Fetch the immutable-ref pipeline status, return code, bounded
          redacted output tail, duration, and coverage evidence. Supports
          bounded polling via wait_seconds.
        allowed_agents: ["TesterAgent"]
        allowed_skills: ["test-runner"]
        input_schema:
          type: "object"
          required: ["pipeline_id"]
          properties:
            pipeline_id: {type: "string"}
            wait_seconds:
              type: "integer"
              default: 0
              description: "Block up to N seconds for the pipeline to finish."
        readonly: true
      - name: "get_coverage"
        description: >-
          Fetch line/branch coverage produced by the exact committed tree
          recorded for a completed pipeline.
        allowed_agents: ["TesterAgent"]
        allowed_skills: ["test-runner"]
        input_schema:
          type: "object"
          required: ["pipeline_id"]
          properties:
            pipeline_id: {type: "string"}
        readonly: true
      - name: "rollback_deployment"
        description: >-
          Roll back the most recent deployment to the previous known-good
          release. Used only by TeamLeader after human-confirmed escalation.
        allowed_agents: ["TeamLeader"]
        allowed_skills: ["team-orchestration"]
        input_schema:
          type: "object"
          required: ["environment"]
          properties:
            environment:
              type: "string"
              enum: ["staging", "production"]
            target_release:
              type: ["string", "null"]
              description: "Specific release tag, or null for previous-good."
        readonly: false
        # Rollback is destructive — require an explicit confirmation token.
        requires_confirmation: true
    rate_limit:
      requests_per_minute: 60
      burst: 10
      on_limit: "queue"
    health_check:
      interval_seconds: 30
      timeout_seconds: 3

# =============================================================================
# Shared MCP client policy
# =============================================================================
# Applied to all servers unless a server overrides a key.
client_policy:
  # Total time to wait for a tool call to return before treating it as failed.
  call_timeout_seconds: 120
  # Reconnect with exponential backoff if a server drops.
  reconnect:
    max_attempts: 5
    initial_delay_seconds: 1
    max_delay_seconds: 15
  # If a server is down at invocation time, fail closed rather than silently
  # skipping the tool — safety over availability for write operations.
  on_server_unavailable: "fail_closed"
  # Tool calls are recorded in the audit log (see security.yaml) with their
  # caller agent, arguments (secrets redacted), and result status.
  audit: true

# =============================================================================
# DevFlow Security Configuration
# =============================================================================
# DevFlow can read only task-scoped repository evidence and execute a candidate
# only inside the Tester boundary. The current AgentTeams release cannot open,
# review, or merge pull requests and cannot deploy or roll back a release.
# Security declarations here must match executable runtime grants.
#
# Four pillars:
#   1. audit_log          — tamper-evident record of every privileged action
#   2. approval_workflow  — human-in-the-loop gate for high-risk tiers
#   3. rollback           — safe failure recovery with bounded retries
#   4. credential_isolation — secrets never reach agents or model prompts
# =============================================================================

# ---------------------------------------------------------------------------
# 1. Audit Log — who did what, when, with what authority
# ---------------------------------------------------------------------------
audit_log:
  enabled: true
  # Append-only JSONL file. One event per line for easy ingestion/grep.
  # Path resolved from AUDIT_LOG_PATH env var so it can differ per env.
  file_path: "${AUDIT_LOG_PATH:-logs/mcp-audit.jsonl}"
  append_fsync: true
  process_safe_sidecar_lock: true
  outcomes: ["denied", "authorized", "succeeded", "failed"]
  # Exact secret-free MCP boundary fields persisted by HashChainAuditLog.
  include_fields:
    - "timestamp"
    - "run_id"
    - "task_id"
    - "issue_id"
    - "agent"
    - "skill"
    - "server"
    - "tool"
    - "readonly"
    - "outcome"
    - "arguments_sha256"
    - "previous_hash"
    - "entry_hash"
  # Integrity: hash-chain consecutive entries so tampering is detectable.
  # The previous entry's hash is included in the current entry's payload.
  chain_hashes: true

# ---------------------------------------------------------------------------
# 2. Approval Workflow — risk-tiered human-in-the-loop
# ---------------------------------------------------------------------------
# Complexity tier (from issue-classifier) maps directly to an approval policy.
# This is the single source of truth referenced by ReviewerAgent boundaries
# and the pr-reviewer skill.
approval_workflow:
  rules:
    - tier: ["T1", "T2", "T3"]
      policy: "auto_approve"
      description: >-
        Low-to-moderate risk: localized fixes, docs, single-module logic.
        Review-eligible after tests pass and security scan is clean. Merge
        remains outside Agent authority and is handled by repository policy.
      conditions:
        tests_passed: true
        no_critical_security_findings: true
        no_high_security_findings: true
      auto_merge: false
    - tier: ["T4", "T5"]
      policy: "require_human_approval"
      description: >-
        High risk: architectural changes, cross-module refactors, security or
        data-affecting changes. Must not merge until a human reviewer records
        explicit approval.
      conditions:
        tests_passed: true
        no_critical_security_findings: true
      required_approvers: 1      # bump to 2 for regulated deployments
      # If no human approves within this window, the AgentTeams project remains
      # paused and TeamLeader emits a reminder; no Worker may resume it.
      approval_timeout_hours: 72
      auto_merge: false
      # Who is allowed to approve. Empty = any repo collaborator with write.
      allowed_roles: []
  # Hard rule: security findings of these severities block ALL tiers.
  blocking_security_severities: ["critical", "high"]
  # A human may force-override a block, but the override is audited and
  # requires a written justification (stored with the approval record).
  allow_override_with_justification: true

# ---------------------------------------------------------------------------
# 3. Rollback — safe failure recovery
# ---------------------------------------------------------------------------
# Deployment rollback is outside the current autonomous closure boundary. The
# portable library retains separately tested approval/rollback primitives, but
# no released Agent or Skill receives that tool.
rollback:
  enabled: false
  # These fields map directly to executable fail-closed checks.
  provider_command_required: true
  known_good_target_required: true
  signed_approval_required: true
  durable_one_shot_approval: true
  automatic_retries: 0
  # The adapter never retries a destructive action implicitly.
  cooldown_seconds: 0
    # Manual triggers — a human requests rollback via the TeamLeader.
  # Health check used to confirm a rollback succeeded.
  health_check:
    url: "${HEALTH_CHECK_URL}"
    required: true
    timeout_seconds: 10
    retry_delay_seconds: 0
    success_threshold: 1

# ---------------------------------------------------------------------------
# 4. Credential Isolation — secrets never touch agents or prompts
# ---------------------------------------------------------------------------
# Agents and LLM prompts must never see raw credentials. The v2 Ed25519 broker
# below is the implemented candidate profile and has not yet been redeployed
# after this receipt upgrade. The earlier live boundary evidence must not be
# cited as proof that v2 signing is active. When deployed, the broker keeps the
# provider token and signing key outside Worker-visible arguments; only
# Locator's github-evidence path receives a task/revision/path-bound read.
credential_isolation:
  implemented_mode: "agentteams_external_ed25519_scope_broker"
  deployment_status: "candidate_not_redeployed"
  provider_secret_source: "gateway_secret_mount"
  internal_handle_ttl_seconds: 300
  # Secrets are referenced by logical name in config (e.g. ${GITHUB_PAT})
  # and resolved by the gateway at runtime. They are NEVER expanded into
  # agent-visible config, logs, traces, or prompts.
  secret_refs:
    github_token: "GITHUB_PERSONAL_ACCESS_TOKEN"
    llm_api_key: "LLM_API_KEY"
  # Trusted adapters map a granted capability to its provider secret. Agents
  # receive only a short-lived signed handle, never these environment values.
  capability_secrets:
    "github:read_file": "GITHUB_PERSONAL_ACCESS_TOKEN"
  # Capabilities granted per agent. An agent can only call gateway-issued
  # tokens for the scopes listed here — least privilege.
  agent_capabilities:
    TeamLeader: []
    TriageAgent: []
    LocatorAgent:
      - "github:read_file"
    CoderAgent: []                    # candidate artifact only; no provider token
    TesterAgent: []                   # isolated CI needs no provider credential
    ReviewerAgent: []                 # candidate review only; no GitHub write
  # Branch protection: write capabilities are only valid on non-default
  # branches. The runtime rejects any write_file targeting main/master.
  branch_protection:
    protected_branches: ["main", "master"]
    require_branch_for_write: true
  # Defense-in-depth: even with the gateway, scrub these patterns from any
  # text before it is sent to the LLM or written to logs.
  prompt_scrubbing:
    enabled: true
    patterns:
      - "ghp_[A-Za-z0-9]{36}"          # GitHub PAT
      - "github_pat_[A-Za-z0-9_]{82}"  # fine-grained PAT
      - "sk-[A-Za-z0-9]{20,}"          # OpenAI-style key
      - "AKIA[0-9A-Z]{16}"             # AWS access key id
      - "-----BEGIN [A-Z ]*PRIVATE KEY-----"  # private key blocks
    replacement: "[REDACTED]"

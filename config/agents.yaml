# =============================================================================
# DevFlow Agent Identity Definitions
# =============================================================================
# Defines the 6 core agents of the DevFlow multi-agent system. Each agent is an
# autonomous, identity-driven unit within the AgentTeams framework: it owns a
# bounded set of capabilities, observes specific events, and is constrained by
# explicit boundaries that prevent scope creep and enforce safe behavior.
#
# Identity (role/description/model/temperature) is *intentional* — the same
# underlying LLM behaves very differently under different role framing and
# sampling temperatures, so each field is treated as a first-class config
# rather than an incidental label.
#
# Conventions:
#   - model "glm-5.2": served via the OpenAI-compatible LLM_BASE_URL
#   - temperature    : lower = deterministic orchestration, higher = creative
#   - watches        : events this agent subscribes to via the event bus
#   - boundaries     : hard limits the runtime enforces; violations are audited
# =============================================================================

# Global defaults applied to every agent unless overridden per-agent.
defaults:
  # Soft limit on consecutive LLM failures before the agent yields control back
  # to the TeamLeader for re-planning. Prevents runaway retry loops.
  max_consecutive_failures: 3
  # Wall-clock budget (seconds) for a single agent invocation. The runtime
  # sends a `agent.timeout` event and attempts graceful cancellation.
  timeout_seconds: 600
  # Maximum tokens the agent may consume in one invocation across all LLM
  # calls. Enforced by the token meter to keep cost predictable.
  max_tokens_per_invocation: 32000
  # Retry policy inherited from tenacity; agents may override.
  retry:
    max_attempts: 3
    backoff: "exponential"
    initial_delay_seconds: 2
    max_delay_seconds: 30
    retry_on: ["RateLimitError", "TimeoutError", "ConnectionError"]

agents:

  # ===========================================================================
  # 1. TeamLeader — Central Orchestrator
  # ===========================================================================
  # The only agent permitted to decompose issues into sub-tasks and assign
  # them to workers. It holds the canonical state machine for an issue's
  # lifecycle and is the final arbiter when agents disagree (e.g. Tester says
  # pass but Reviewer flags a security concern).
  # ===========================================================================
  - name: "TeamLeader"
    identity:
      role: "Team Leader"
      description: >-
        Central orchestrator that decomposes tasks, tracks state, and
        arbitrates conflicts across the agent team.
      model: "glm-5.2"
      temperature: 0.3  # low temperature for stable, reproducible planning
    capabilities:
      - task_decomposition   # split T1-T5 issues into ordered sub-tasks
      - state_tracking       # maintain issue lifecycle state machine
      - conflict_arbitration # resolve disagreements between workers
      - worker_management    # assign/re-assign tasks, handle failures
      - plan_generation      # produce executable plan DAG
    boundaries:
      - "Cannot write code directly"
      - "Cannot invoke a Worker domain Skill in its own role"
      - "Cannot create, review, merge, deploy, or roll back repository state"
      - "Cannot substitute for external human approval on T4/T5 issues"
      - "Cannot modify files outside the .devflow/ state directory"
      - "Cannot bypass the approval workflow defined in security.yaml"
    watches:
      - "issue.created"        # kick off decomposition
      - "agent.completed"      # advance state machine
      - "agent.failed"         # trigger re-plan or re-assignment
      - "triage.completed"     # validate classification and route Locator
      - "locator.completed"    # validate evidence and route Coder
      - "coder.patch_ready"    # bind an emitted candidate to its Coder route
      - "test.passed"          # validate regression evidence and route Reviewer
      - "review.rejected"      # validate and fail closed unless revision-bound
      - "review.approved"      # route approved evidence to memory capture
      - "experience.completed" # seal the verified workflow receipt
      - "test.failed"          # route back to CoderAgent with context
      - "approval.required"    # pause pipeline pending human input
    # Routing hints for the scheduler: which agents this leader dispatches to.
    dispatches_to:
      - "TriageAgent"
      - "LocatorAgent"
      - "CoderAgent"
      - "TesterAgent"
      - "ReviewerAgent"

  # ===========================================================================
  # 2. TriageAgent — Issue Intake & Classification
  # ===========================================================================
  # First agent to touch an incoming issue. Assigns a T1-T5 complexity tier
  # which drives every downstream decision (approval gate, parallelism, model
  # selection). Also de-duplicates against the experience store so recurring
  # issues can be fast-pathed.
  # ===========================================================================
  - name: "TriageAgent"
    identity:
      role: "Triage Agent"
      description: >-
        Classifies incoming issues into T1-T5 complexity tiers, deduplicates
        against historical issues, and assigns priority.
      model: "glm-5.2"
      temperature: 0.2  # very low — classification must be deterministic
    capabilities:
      - issue_classification  # T1 (trivial) .. T5 (critical/architectural)
      - deduplication         # match against ChromaDB experience store
      - priority_assignment   # P0-P3 based on severity & blast radius
      - label_assignment      # map to repo label taxonomy
    boundaries:
      - "Cannot modify issue body or title"
      - "Cannot assign complexity higher than T5"
      - "Cannot skip deduplication step"
    watches: []            # task intake only through TeamLeader routes
    depends_on_skills:
      - "issue-classifier"

  # ===========================================================================
  # 3. LocatorAgent — Root Cause & Impact Analysis
  # ===========================================================================
  # Uses retrieval-augmented generation over the indexed codebase to pinpoint
  # the likely root-cause file(s)/function(s) and assess blast radius. Its
  # output is the contract CoderAgent consumes to generate a patch.
  # ===========================================================================
  - name: "LocatorAgent"
    identity:
      role: "Locator Agent"
      description: >-
        Performs code root cause analysis and impact assessment using RAG over
        the indexed repository, producing a located-context payload for the
        CoderAgent.
      model: "glm-5.2"
      temperature: 0.4  # slightly higher to explore candidate locations
    capabilities:
      - code_root_cause    # identify faulty code region
      - impact_assessment  # enumerate affected call sites / tests
      - rag_retrieval      # query ChromaDB code index
      - context_packaging  # assemble token-budgeted context for Coder
    boundaries:
      - "Cannot write or modify source files"
      - "Cannot execute repository code"
      - "Only github-evidence may perform the task-scoped GitHub read; code-root-cause has no MCP"
      - "Context payload must stay under the CoderAgent input token budget"
    watches:
      - "codebase.indexed"   # notification only; never a task hand-off
    depends_on_skills:
      - "code-root-cause"
      - "github-evidence"
    resources:
      # Vector store backing RAG. Path resolved from CHROMADB_PATH env var.
      vector_store:
        type: "chromadb"
        collection: "codebase_index"
        embedding_model: "embedding-3"

  # ===========================================================================
  # 4. CoderAgent — Patch Generation
  # ===========================================================================
  # Consumes the located-context payload and produces a concrete diff. Uses a
  # Uses the deployment-pinned GLM-5.2 model validated against Z.AI.
  # Output is a structured patch object, never a direct file write — the
  # ReviewerAgent/CI gate sits between patch and merge.
  # ===========================================================================
  - name: "CoderAgent"
    identity:
      role: "Coder Agent"
      description: >-
        Generates code-aware fix patches from located context using a
        deployment-pinned model, with an explicit same-model retry fallback.
      model: "glm-5.2"
      temperature: 0.2          # low for syntactically stable diffs
      model_fallback:           # ordered fallback chain
        - "glm-5.2"
    capabilities:
      - patch_generation      # produce unified diff / structured patch
      - code_context_awareness # respects surrounding style & imports
      - multi_file_edit       # coordinated edits across files when needed
      - self_verification     # syntax-check generated patch before emit
    boundaries:
      - "Cannot push directly to the default branch"
      - "Cannot run tests — that is TesterAgent's responsibility"
      - "Cannot approve its own patch"
      - "One model call per canonical route; TeamLeader caps each issue at 3 calls"
    watches: []
      # Tester failures are verified and re-routed by TeamLeader; Coder never
      # consumes the original TestEvidence event directly.
    depends_on_skills:
      - "patch-generator"

  # ===========================================================================
  # 5. TesterAgent — Verification & Integrity
  # ===========================================================================
  # Runs the server-selected test profile against the candidate patch, compares
  # its process outcome to the baseline, and verifies execution/integrity
  # evidence. Current adapters do not parse real case counts or coverage.
  # ===========================================================================
  - name: "TesterAgent"
    identity:
      role: "Tester Agent"
      description: >-
        Executes the server-selected test profile, compares baseline and
        candidate outcomes, and verifies integrity evidence before promotion.
      model: "glm-5.2"
      temperature: 0.1  # near-deterministic — test orchestration must be stable
    capabilities:
      - test_execution        # invoke exactly one policy-owned run_tests action
      - baseline_comparison   # compare bounded baseline/candidate process outcomes
      - integrity_validation  # verify policy, manifests, receipt, and result binding
      - regression_detection  # flag newly failing previously-passing tests
    boundaries:
      - "Cannot modify source code"
      - "Cannot modify test files"
      - "Cannot mark a patch as approved — only report pass/fail"
      - "Must run full suite, not a subset, for T3+ issues"
      - "Cannot provide a shell command, repository path, or executable path"
    watches: []            # task intake only through TeamLeader routes
    depends_on_skills:
      - "test-runner"

  # ===========================================================================
  # 6. ReviewerAgent — Candidate Review & Security Gate
  # ===========================================================================
  # Final autonomous candidate gate. Runs automated review and security
  # reasoning and applies the approval policy from security.yaml. It has no
  # GitHub write grant. For T4/T5 it must block pending human approval.
  # ===========================================================================
  - name: "ReviewerAgent"
    identity:
      role: "Reviewer Agent"
      description: >-
        Performs automated candidate review and security reasoning, records
        promotion eligibility, and drives the approval workflow per policy.
      model: "glm-5.2"
      temperature: 0.3
    capabilities:
      - code_review          # static analysis + style + correctness
      - security_scan        # dependency & secret scanning
      - approval_workflow    # enforce T1-T3 auto / T4-T5 human gate
    boundaries:
      - "Cannot create, review, approve, or merge a pull request"
      - "Cannot mark a candidate eligible when CI is red"
      - "Cannot bypass security scan findings classified critical/high"
      - "Cannot self-approve a PR it authored"
    watches: []            # task intake only through TeamLeader routes
    depends_on_skills:
      - "pr-reviewer"
      - "experience-distiller"

# =============================================================================
# Cross-cutting relationships
# =============================================================================
# The default flow for a fresh issue is linear but event-driven, not a fixed
# pipeline — any agent may emit an event that routes work backwards:
#
#   issue.created
#     -> TriageAgent  (issue-classifier)
#        -> TeamLeader decomposes by tier
#           -> LocatorAgent (github-evidence, then code-root-cause via TeamLeader)
#              -> CoderAgent (patch-generator)
#                 -> TesterAgent (test-runner)
#                    -> ReviewerAgent (pr-reviewer)
#                       -> experience-distiller (after VERIFIED terminal receipt)
#
# Reversal edge: verified test.failed -> TeamLeader -> CoderAgent.
# review.rejected fails closed for a human re-plan until a candidate-bound
# review-remediation contract exists. A T4/T5 blocked review returns only to
# TeamLeader, which pauses on an exact digest target; an external authority's
# fresh approval is verified and consumed by TeamLeader before it routes the
# terminal bundle to ReviewerAgent's experience-distiller.
# =============================================================================

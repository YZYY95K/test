name: quality-gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: src
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements/dev.lock.txt
      - name: Install
        run: python -m pip install --require-hashes -r requirements/dev.lock.txt
      - name: Validate configuration
        run: python -m devflow.cli validate
      - name: Verify pinned AgentTeams contract
        run: python scripts/verify_agentteams_upstream.py
      - name: Verify finals materials
        run: >-
          python scripts/verify_finals_materials.py
          --pptx "outputs/DevFlow_GOAI_2026_决赛路演_20260728.pptx"
          --pdf "outputs/DevFlow_GOAI_2026_决赛路演_20260728.pdf"
      - name: Validate fixed repository-repair manifest
        run: >-
          python scripts/run_repository_benchmark.py
          --repair-manifest benchmarks/repository_repair/tasks.yaml
          --validate-only
      - name: Lint
        run: ruff check .
      - name: Type check
        run: mypy src scripts tests
      - name: Build AgentTeams package
        run: python scripts/build_agentteams_package.py
      - name: Test
        run: python -m pytest --cov=devflow --cov-report=term --cov-fail-under=80 -q
      - name: Evaluate Skills
        run: python scripts/evaluate_skills.py
      - name: Validate behavioral evaluation suite
        run: python scripts/run_behavior_evals.py --validate-only
      - name: Rebuild, compare, and verify finals submission archive
        if: matrix.python-version == '3.12'
        run: |
          final_name="DevFlow_GOAI_2026_finals-${GITHUB_SHA}.zip"
          rebuild_name=".DevFlow_GOAI_2026_finals-rebuild-${GITHUB_SHA}.zip"
          final_path="dist/${final_name}"
          rebuild_path="dist/${rebuild_name}"
          python scripts/build_finals_submission.py build \
            --ref "${GITHUB_SHA}" \
            --output "${final_path}"
          python scripts/build_finals_submission.py build \
            --ref "${GITHUB_SHA}" \
            --output "${rebuild_path}"
          cmp -- "${final_path}" "${rebuild_path}"
          python scripts/build_finals_submission.py verify \
            "${final_path}"
          python scripts/build_finals_submission.py verify \
            "${rebuild_path}"
          (
            cd dist
            sha256sum "${final_name}" > "${final_name}.sha256"
            sha256sum --check "${final_name}.sha256"
          )
      - uses: actions/upload-artifact@v4
        with:
          name: devflow-role-packages-v2.1.0-python-${{ matrix.python-version }}
          path: |
            dist/devflow-*-v2.1.0.zip
            dist/devflow-*-v2.1.0.zip.sha256
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: devflow-finals-submission-${{ github.sha }}
          path: |
            dist/DevFlow_GOAI_2026_finals-${{ github.sha }}.zip
            dist/DevFlow_GOAI_2026_finals-${{ github.sha }}.zip.sha256
          if-no-files-found: error

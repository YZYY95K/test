schema_version: "1.0"
name: pr-reviewer
version: "3.0.0"
owner: ReviewerAgent
intent: Independently gate a tested candidate and create a policy-compliant PR.
invoke_when:
  - TestEvidence is current, integrity-checked, and eligible for review.
  - A T4 or T5 tested candidate needs an exact human-approval pause target.
refuse_when:
  - Tests failed, regressed, errored, are stale, or do not match the candidate.
  - The authoring agent asks to self-approve or bypass a security or human gate.
input:
  type: TestEvidence
  schema_version: "1.0"
  required_fields:
    [issue_id, candidate_digest, baseline_revision, suite, status, totals,
     baseline_comparison, evidence]
output:
  type: ReviewDecision
  schema_version: "1.0"
  required_fields:
    [issue_id, tier, review]
dependencies:
  - Scoped GitHub PR and review MCP capabilities.
  - Versioned security scanners and config/security.yaml policy.
  - Append-only approval and audit evidence store.
mcp_tools:
  - github:create_pull_request
  - github:add_review
allowed_actions:
  - Read candidate, test, policy, and security evidence.
  - Submit a review and create a pull request through scoped tools.
  - Record merge eligibility for a human-owned or repository-policy process.
forbidden_actions:
  - Approve red, stale, incomplete, or mismatched test evidence.
  - Dismiss unresolved high or critical security findings.
  - Auto-approve or auto-merge T4 or T5.
  - Merge any pull request or invoke a deployment or rollback operation.
  - Self-approve a change authored by the same agent instance.
  - Fabricate a pull-request URL or human approval record.
handoffs:
  - "on": success
    consumer: TeamLeader
    artifact_type: ReviewDecision
    event: review.approved
  - "on": failure
    consumer: TeamLeader
    artifact_type: ReviewDecision
    event: review.rejected
  - "on": blocked
    consumer: TeamLeader
    artifact_type: ReviewDecision
    event: approval.required
failures:
  - code: SECURITY_SCAN_UNAVAILABLE
    retryable: true
    max_attempts: 1
    action: Fail closed for T3+ and require human review for T1/T2.
    route_to: TeamLeader
    event: review.blocked
  - code: PR_CREATE_FAILED
    retryable: true
    max_attempts: 2
    action: Preserve review decision and mark PR creation deferred.
    route_to: TeamLeader
    event: review.degraded
  - code: POLICY_BLOCK
    retryable: false
    max_attempts: 0
    action: Record the unmet gate and stop promotion.
    route_to: TeamLeader
    event: approval.required
verification:
  - id: evidence-binding
    requirement: Candidate, test, and review digests identify the same revision.
    evidence: Digest and repository-revision comparison.
  - id: security
    requirement: No unresolved high or critical finding exists.
    evidence: Versioned scanner reports and finding dispositions.
  - id: approval-policy
    requirement: T4 and T5 return to TeamLeader as blocked; only an external authority may sign the exact Leader target.
    evidence: Reviewer parent route, pause target digest, approver identity, timestamp, one-shot approval record, and resumed route.
release:
  compatibility: AgentTeams v1beta1 and HandoffEnvelope 1.x.
  change_policy: v3 makes TeamLeader the mandatory mediator for blocked reviews; any approval relaxation requires a major version and human sign-off.
  rollback: Restore the prior stricter signed bundle; never grandfather blocked reviews.
examples_ref: references/examples.md

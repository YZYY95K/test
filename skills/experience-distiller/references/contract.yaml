schema_version: "1.0"
name: experience-distiller
version: "5.0.0"
owner: ReviewerAgent
intent: Convert a cryptographically digest-bound, clean, approved run into safe reusable experience.
invoke_when:
  - TeamLeader supplies a VerifiedTerminalReceipt for a regression-free candidate and autonomous approved review.
  - The repository revision, candidate, test, review, and receipt digests all match.
  - The receipt-bound TestRunResult contains a verified immutable-baseline TestIntegrityAttestation v1.0.
  - A human-approved receipt includes exact consumed approval evidence; an autonomous receipt includes none.
refuse_when:
  - The run is active, failed, regressed, rejected, human-pending, lacks digests, or has uncertain redaction.
  - The receipt is missing, stale, tampered, or belongs to another issue, revision, or candidate.
  - The test result lacks verified immutable-test integrity evidence.
  - The request asks to change the completed outcome or trigger new work.
input:
  type: VerifiedRunBundle
  schema_version: "1.0"
  required_fields:
    [issue_id, issue, tier, repository_revision, located_context, patch,
     test_result, review, trace_id, terminal_receipt]
  optional_fields: [human_approval]
output:
  type: ExperiencePattern
  schema_version: "1.0"
  required_fields:
    [pattern_id, schema_version, outcome, summary, reusable_lesson,
     provenance, redaction, stored]
dependencies:
  - Read-only terminal audit and artifact store.
  - Idempotent experience vector store with redaction scanning.
mcp_tools: []
allowed_actions:
  - Read immutable terminal artifacts and audit evidence.
  - Redact and abstract reviewed evidence.
  - Create or update a deduplicated experience record.
forbidden_actions:
  - Store raw secrets, personal data, or full private source files.
  - Store an active or unreviewed run as trusted experience.
  - Invent causal claims not supported by linked evidence.
  - Trigger coding, testing, review, merge, or tracker actions.
handoffs:
  - "on": success
    consumer: TeamLeader
    artifact_type: ExperiencePattern
    event: experience.completed
  - "on": blocked
    consumer: TeamLeader
    artifact_type: SkillFailure
    event: experience.quarantined
failures:
  - code: NON_TERMINAL_EVIDENCE
    retryable: false
    max_attempts: 0
    action: Reject failed, regressed, rejected, or human-pending evidence before storage.
    route_to: TeamLeader
    event: experience.rejected
  - code: PROVENANCE_INCOMPLETE
    retryable: false
    max_attempts: 0
    action: Reject storage and report missing evidence.
    route_to: TeamLeader
    event: experience.rejected
  - code: REDACTION_UNCERTAIN
    retryable: false
    max_attempts: 0
    action: Quarantine the candidate pattern for human inspection.
    route_to: TeamLeader
    event: experience.quarantined
  - code: STORE_UNAVAILABLE
    retryable: true
    max_attempts: 2
    action: Retry idempotently without changing the completed run.
    route_to: TeamLeader
    event: experience.degraded
verification:
  - id: provenance
    requirement: Every claim links to one digest-valid VerifiedTerminalReceipt and its exact clean approved artifacts.
    evidence: Receipt digest, trace ID, repository revision, candidate digest, test-result digest, and review digest.
  - id: test-integrity
    requirement: Trusted memory requires a receipt-bound, verified immutable-baseline test attestation.
    evidence: Exact integrity policy digest, matching protected manifests, and explicit isolation boundary.
  - id: redaction
    requirement: Secret and personal-data scans pass before storage.
    evidence: Redaction rule version and scan result.
  - id: dedup
    requirement: Similar patterns update provenance rather than duplicate content.
    evidence: Similarity result and chosen create-or-update operation.
  - id: durable-completion
    requirement: A successful ExperiencePattern is digest-bound to the exact VerifiedRunBundle and has stored=true only after durable store acknowledgement; stored=false is a failed invocation.
    evidence: Source-bound provenance fields, deterministic pattern ID, store receipt, standalone validator result, and TeamHarness Skill validation attestation.
  - id: failure-contract
    requirement: Storage, provenance, and redaction failures emit only SkillFailure 1.0 to TeamLeader; no Worker contacts a human directly.
    evidence: Failed HandoffEnvelope, exact source digest, declared failure code and retry budget, and Leader-owned escalation record.
release:
  compatibility: AgentTeams v1beta1 and HandoffEnvelope 1.x.
  change_policy: v5 requires durable storage acknowledgement, source-bound output validation, TeamLeader-only failure routing, and SkillFailure 1.0; any relaxation requires a major version.
  rollback: Restore the prior signed bundle and quarantine records from the reverted version.
examples_ref: references/examples.md

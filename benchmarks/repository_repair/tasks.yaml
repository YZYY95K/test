    target_paths: [src/requests/hooks.py]
    mutation:
      path: src/requests/hooks.py
      before: |2
                    if _hook_data is not None:
                        hook_data = _hook_data
      after: |2
                    if _hook_data is None:
                        hook_data = _hook_data
      sha256: 0db927369df8dcb7a9d29b2891e47a56915a7b3317260033017fed885dcb8f94
    acceptance: [{argv: [python, -m, pytest, -q, tests/test_hooks.py::test_hooks], timeout_seconds: 120}]
    human_intervention_expected: false


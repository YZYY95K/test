tasks:
  - id: requests-adapter-leading-slash
    repository: requests
    title: Repair leading path separator normalization
    issue: Restore the single-slash HTTP adapter path normalization changed by the pinned mutation.
    origin: deterministic-mutation
    execution_ready: true
    target_paths: [src/requests/adapters.py]
    mutation:
      path: src/requests/adapters.py
      before: |2
                    url = f"/{url.lstrip('/')}"
      after: |2
                    url = request.path_url
      sha256: 7efc8dd9c9f8374b789b74a2de2cb4325d53930101639b62e5834800f271e27f
    acceptance: [{argv: [python, -m, pytest, -q, tests/test_adapters.py::test_request_url_trims_leading_path_separators], timeout_seconds: 120}]
    human_intervention_expected: false

  - id: requests-default-hook-map
    repository: requests
    title: Repair default response hook initialization
    issue: Restore creation of the default response hook list after a deterministic empty-map mutation.
    origin: deterministic-mutation
    execution_ready: true
    target_paths: [src/requests/hooks.py]
    mutation:
      path: src/requests/hooks.py
      before: |2
            return {event: [] for event in HOOKS}
      after: |2
            return {}
      sha256: 7838e7b65d4754e13eaf912e670ecc7d5053e80684837d77fa1c8eaa9d6df9fe
    acceptance: [{argv: [python, -m, pytest, -q, tests/test_hooks.py::test_default_hooks], timeout_seconds: 120}]
    human_intervention_expected: false

